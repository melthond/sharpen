<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" role="img" aria-label="The gate sorts each prompt three ways. Clear: Sharpen only adds context. Fill-in: it fills the gaps from the conversation and code. Ambiguous: it asks which you meant, with 2 to 3 options plus Run as typed. All three end on the review card.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="236" rx="16" fill="#14161b"/>

  <rect x="32" y="90" width="150" height="56" rx="10" fill="#1f232b" stroke="#3a404c"/>
  <text x="107" y="123" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#e6e8eb">your prompt</text>
  <line x1="182" y1="118" x2="236" y2="118" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="240" y="90" width="120" height="56" rx="10" fill="#1f232b" stroke="#ff5a5a" stroke-width="1.5"/>
  <text x="300" y="116" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ff6b6b">Gate</text>
  <text x="300" y="134" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa3b2">how many readings?</text>

  <g stroke="#9aa3b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <polyline points="360,118 384,118 384,52 416,52"/>
    <polyline points="360,118 416,118"/>
    <polyline points="360,118 384,118 384,184 416,184"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="420" y="24" width="428" height="56" rx="10" fill="#1f232b" stroke="#3a404c"/>
    <text x="440" y="48" font-size="14" font-weight="600" fill="#e6e8eb">Clear · one reading, says what and where</text>
    <text x="440" y="67" font-size="12" fill="#9aa3b2">keeps your words, only adds context: where, tools, check</text>

    <rect x="420" y="90" width="428" height="56" rx="10" fill="#1f232b" stroke="#3a404c"/>
    <text x="440" y="114" font-size="14" font-weight="600" fill="#e6e8eb">Fill-in · one sensible reading, details missing</text>
    <text x="440" y="133" font-size="12" fill="#9aa3b2">fills the gaps from the conversation and the code</text>

    <rect x="420" y="156" width="428" height="56" rx="10" fill="#1f232b" stroke="#3a404c"/>
    <text x="440" y="180" font-size="14" font-weight="600" fill="#e6e8eb">Ambiguous · readings lead to different work</text>
    <text x="440" y="199" font-size="12" fill="#9aa3b2">"Which did you mean?" 2–3 engineered options + Run as typed</text>
  </g>
</svg>
