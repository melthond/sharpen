<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-label="You type 'fix the login thing'. Sharpen reads your conversation, code, tools and hooks, and shows the engineered prompt on a review card with Send it and Run my original. It is also copied to your clipboard.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="320" rx="16" fill="#14161b"/>

  <!-- what the user typed -->
  <text x="32" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9aa3b2">You type</text>
  <rect x="32" y="134" width="236" height="52" rx="10" fill="#1f232b" stroke="#3a404c"/>
  <text x="150" y="166" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#e6e8eb">fix the login thing</text>

  <!-- what Sharpen reads -->
  <line x1="276" y1="160" x2="384" y2="160" stroke="#9aa3b2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="146" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9aa3b2">Sharpen reads</text>
  <text x="330" y="182" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9aa3b2">conversation · code</text>
  <text x="330" y="198" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9aa3b2">tools · hooks</text>

  <!-- the review card -->
  <rect x="392" y="32" width="456" height="256" rx="12" fill="#1f232b" stroke="#ff5a5a" stroke-width="1.5"/>
  <text x="412" y="62" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ff6b6b">Sharpened prompt (fill-in):</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#d7dae0">
    <text x="412" y="90">Fix the PIN lockout in apps/admin/auth/pin.ts</text>
    <text x="412" y="110">Symptom: locks after 1 wrong PIN, should be 5</text>
    <text x="412" y="130">Decided: keep the counter in pin.ts</text>
    <text x="412" y="150">Tools: systematic-debugging → test-automator</text>
    <text x="412" y="170">Hooks: dead-code-check runs after every edit</text>
    <text x="412" y="190">Done when: npm test -- pin passes</text>
  </g>
  <line x1="412" y1="210" x2="828" y2="210" stroke="#3a404c"/>
  <rect x="412" y="226" width="112" height="34" rx="8" fill="#e5484d"/>
  <text x="468" y="248" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Send it</text>
  <rect x="536" y="226" width="146" height="34" rx="8" fill="none" stroke="#5a6170"/>
  <text x="609" y="248" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#d7dae0">Run my original</text>
  <text x="828" y="248" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9aa3b2">+ copied to clipboard</text>
</svg>
