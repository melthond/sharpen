name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '22'] # 18 is the minimum in package.json
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        run: npm test

      - name: Check version consistency
        shell: bash
        run: |
          node -e '
            const a = require("./package.json").version;
            const b = require("./.claude-plugin/plugin.json").version;
            if (a !== b) { console.error(`package.json is ${a} but plugin.json is ${b}`); process.exit(1); }
            console.log(`version ${a} matches`);
          '
